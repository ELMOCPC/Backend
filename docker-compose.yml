services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/elmocpc/backend:latest
    container_name: elmocpc_backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: elmocpc_postgres
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: elmocpc_redis
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${RDB_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
