services:
  postgres:
    image: postgres:17-alpine
    container_name: elmocpc_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elmocpc_network

  redis:
    image: redis:8-alpine
    container_name: elmocpc_redis
    environment:
      REDIS_PASSWORD: ${RDB_PASSWORD}
    command: redis-server --requirepass ${RDB_PASSWORD}
    ports:
      - "${RDB_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elmocpc_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  elmocpc_network:
    driver: bridge
